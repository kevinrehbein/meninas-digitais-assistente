
name: Keep services awake

on:
  schedule:
    - cron: "*/10 * * * *"  # a cada 10 minutos
    - cron: "0 0 * * *"     # uma vez por dia, meia noite UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend
        if: github.event.schedule == '0 0 * * *'
        run: curl -fsS "${{ secrets.API_URL }}/api/health"

      - name: Ping frontend
        run: curl -fsS "${{ secrets.RENDER_URL }}/"

      - name: Ping embeddings
        if: github.event.schedule == '0 0 * * *'
        run: |
          curl -fsS -X POST \
            "${{ secrets.EMBEDDINGS_URL }}/gradio_api/call/v2/embed" \
            -H "Content-Type: application/json" \
            -d '{"payload":"Keep alive"}'
