
name: Keep services awake

on:
  schedule:
    - cron: "*/5 * * * *"  # a cada 5 minutos
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend
        if: github.event.schedule == '0 */12 * * *'
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            "${{ secrets.API_URL }}/api/health"

      - name: Ping frontend
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 45 \
            "${{ secrets.RENDER_URL }}/"

      - name: Ping embeddings
        if: github.event.schedule == '0 */12 * * *'
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -X POST \
            "${{ secrets.EMBEDDINGS_URL }}/gradio_api/call/v2/embed" \
            -H "Content-Type: application/json" \
            -d '{"payload":"Keep alive"}'
